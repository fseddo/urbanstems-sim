<!--
Reference HTML — UrbanStems upstream PDP hero, touch (mobile / tablet) view.
Captured during the PDP refactor. Delete when
docs/improvements/pdp-refactor.md is removed.

Diff vs `pdp-ref-hero-non-touch.html` (same DOM, only Swiper state classes
+ inline styles differ):

| | Non-touch | Touch |
|---|---|---|
| Wrapper inline style | `transform: translate3d(0,0,0)` | `cursor: grab` |
| Slide 1 classes | `swiper-slide-visible swiper-slide-active` | `swiper-slide-visible swiper-slide-fully-visible swiper-slide-active` |
| Slide 2 / 3 classes | unchanged from non-touch | unchanged from non-touch |

The presence of `swiper-slide-fully-visible` ONLY on touch slide 1 is the
key signal: on touch, only the active slide is fully on-screen — the other
two are scrolled off (and become the swipe targets). On non-touch, multiple
slides are partially visible side-by-side because `swiper-slide-fully-visible`
isn't set.

The HTML/data is byte-identical between modes. Reference uses a single
component that branches on input mode via CSS + Swiper config, NOT a
separate touch component vs a separate desktop component. This is what
our `<ProductHeroGallery>` should mirror.
-->
