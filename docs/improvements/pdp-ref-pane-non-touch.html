PANE GEOMETRY TOKENS (Phase 3.1)
================================

```css
.pdp__info {
  --margin-desktop: 40px 0 0 calc(80/1568 * 100%);
  --margin-mobile: 0;
  --padding-desktop: var(--pdp-info-padding-desktop, 36px clamp(32px, calc(40/1728 * 100%), 74px) clamp(40px, calc(74/1728 * 100%), 74px));
  --padding-mobile: 28px 16px 51px;
  --width-desktop: calc(640/1568 * 100%);
  --width-mobile: 100%;
}
```

- Desktop width: `calc(640/1568 * 100%)` ≈ 40.8% of containing block.
- Desktop margin: `40px 0 0 calc(80/1568 * 100%)` — top 40, no right/bottom,
  left 5.1% of containing block (the gutter from the left zone).
- Desktop padding: 36px top, sides clamp(32, ~2.31vw against 1728, 74),
  bottom clamp(40, ~4.28vw against 1728, 74).
- Mobile: 100% width, no margin, 28/16/51 padding.

PAGE-LEVEL ZONES (deduced from cross-referencing image-grid HTML)
================================================================

Cross-referenced with `pdp-ref-image-grid-non-touch.html`:
- `.pdp__secondary` (image grid + accordions zone): width 848/1568 ≈ 54.1%
- gutter: 80/1568 ≈ 5.1% (the pane's left margin)
- `.pdp__info` (this pane): width 640/1568 ≈ 40.8%
- 54.1% + 5.1% + 40.8% = 100%

So the page-level layout below the hero is a flex/grid with two zones:
left = `.pdp__secondary` (54.1%), right = `.pdp__info` (40.8%), gap = 5.1%.
The pane sticks via `.pdp__info--sticky`; the left zone scrolls normally.
