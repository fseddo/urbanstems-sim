<!--
Reference HTML — UrbanStems upstream PDP hero, non-touch (mouse) view.
Captured during the PDP refactor for reference parity. Delete when
docs/improvements/pdp-refactor.md is removed.

Observations (so we don't have to re-parse this every time):

- THREE slides, not two. Reference has main + supporting1 + supporting_lifestyle.
  Our current data model is main_image + hover_image only — gallery would
  need extending if we want 3-slide parity. (Our SwipeCarousel already
  generic-over-T, so component side is fine; data model is the constraint.)

- Wrapper is `.pdp__media-items.swiper-wrapper` (Swiper.js). On non-touch
  all slides have `swiper-slide-visible` so they sit side-by-side. The
  wrapper carries `transform: translate3d(0,0,0)` (no slide offset).

- Per-slide CSS custom props: `--width-desktop: auto; --width-mobile: 100%;`.
  On desktop each slide is `auto`-width — sized by the rendered image's
  natural aspect × the wrapper's height. So **wrapper height controls
  hero size**; slide widths fall out of intrinsic aspect ratios. (This is
  why we'd need their CSS for `.pdp__media-items` to know the height ramp.)

- Each `<img>`:
  - Intrinsic dimensions: 420×449 (main) or 420×330 (supporting). Different
    ratios → different rendered widths at any wrapper height.
  - `loading="eager"` + `fetchpriority="high"` on slides 1 + 2.
  - `loading="lazy"` + `fetchpriority="auto"` on slide 3 (offscreen until
    swiped on touch; on non-touch may still be partially visible).

- 5 srcset tiers: 1600+, 1200+, 1024+, 430+, default. Default img has
  `srcset="...&width=352 352w, ...&width=420 420w"` and `src="...width=420"`.
  Compare to our current `<PictureSrcset>` widths [400, 800, 1200, 1600] —
  we should expand to match.
-->
